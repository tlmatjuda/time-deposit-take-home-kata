services:
  postgres:
    image: postgres:16-alpine
    container_name: time-deposit-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: time_deposit
      POSTGRES_USER: time_deposit
      POSTGRES_PASSWORD: time_deposit
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U time_deposit -d time_deposit"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
